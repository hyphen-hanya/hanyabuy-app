name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 安装 Gradle 8.7 (直接提供 gradle 命令, 不依赖 wrapper)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 诊断: 打印 gradle 与 java 版本
      - name: Versions
        run: |
          gradle --version
          java -version

      # 用 gradle 直调构建 (不用 ./gradlew, 避免 wrapper 缺失问题)
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hanyabuy-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        if: always()
