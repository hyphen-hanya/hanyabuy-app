name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Gradle & JDK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          java-version: "17"

      # 构建 debug APK, 把完整日志落盘, 让 GITHUB_ENV 记录退出码
      - name: Build debug APK
        id: build
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace > build_stdout.log 2>&1
          echo "GRADLE_EXIT=$?" >> "$GITHUB_ENV"
          echo "GRADLE_EXIT=$?" >> /tmp/exitcode.txt 2>/dev/null || true

      # 把真实错误日志打印到 job 输出(可直接在 workflow 页面看到, 不依赖 artifact 下载)
      - name: Dump Gradle log tail
        if: always()
        run: |
          echo "===== GRADLE_EXIT env ====="
          echo "GRADLE_EXIT=$GRADLE_EXIT"
          echo "===== BUILD RESULT ====="
          grep -niE "BUILD SUCCESSFUL|BUILD FAILED|what went wrong|caused by|minimum supported|could not resolve|not found|error:|FAILURE" build_stdout.log | head -40
          echo "===== TAIL 60 ====="
          tail -n 60 build_stdout.log

      - name: Build release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace || true

      # 始终上传 APK(存在则传) + 始终上传日志
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanyabuy-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
        if: always()

      - name: Upload gradle log
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build_stdout.log
        if: always()
