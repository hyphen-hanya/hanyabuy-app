name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Gradle & JDK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          java-version: "17"

      # 构建 debug APK, 完整日志落盘
      - name: Build debug APK
        id: build
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace --info > build_stdout.log 2>&1 || true
          echo "GRADLE_EXIT=$?" >> "$GITHUB_ENV"

      # 用 ::error:: 工作流命令, 让真实错误成为"annotation", 会显示在 run 总结页(可匿名读取)
      - name: Report Gradle error as annotation
        if: failure() || env.GRADLE_EXIT != '0' || always()
        run: |
          if [ "$GRADLE_EXIT" != "0" ]; then
            echo "::error::GRADLE build failed (exit $GRADLE_EXIT)"
            echo "::error::===== BUILD RESULT ====="
            grep -niE "BUILD FAILED|what went wrong|caused by:|minimum supported|could not (resolve|find)|FAILURE: Build failed|Execution failed" build_stdout.log | sed 's/^/::error::/'
            echo "::error::===== TAIL 40 ====="
            tail -n 40 build_stdout.log | sed 's/^/::error::/'
          else
            echo "BUILD SUCCESS"
            tail -n 10 build_stdout.log
          fi

      - name: Build release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanyabuy-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
        if: always()

      - name: Upload gradle log
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build_stdout.log
        if: always()
