name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 必须单独用 setup-java 设置 (setup-gradle 不接收 java-version)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 构建 debug APK, 完整日志落盘 (不 || true, 让失败真正暴露; 用 continue-on-error 保持后续诊断步骤运行)
      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace --info > build_stdout.log 2>&1
          echo "GRADLE_EXIT=$?" >> "$GITHUB_ENV"
          echo "done"

      # 把真实错误用 ::error:: 喷成 annotation(run总结页可读)
      - name: Report Gradle result as annotation
        id: report
        run: |
          echo "GRADLE_EXIT=$GRADLE_EXIT"
          if [ "$GRADLE_EXIT" != "0" ]; then
            echo "::error::GRADLE build failed (exit $GRADLE_EXIT)"
            echo "::error::===== BUILD RESULT ====="
            grep -niE "BUILD FAILED|what went wrong|caused by:|minimum supported|could not (resolve|find)|FAILURE: Build failed|Execution failed" build_stdout.log | sed 's/^/::error::/'
            echo "::error::===== KOTLIN/COMPILE ERRORS (e:/error:/.kt:line) ====="
            grep -niE "\.kt:[0-9]+|e: |error:|unresolved reference|type mismatch|expecting|Kotlin:|arguments|inferred type|The expression" build_stdout.log | sed 's/^/::error::/' | head -40
            echo "::error::===== TAIL 60 ====="
            tail -n 60 build_stdout.log | sed 's/^/::error::/'
          else
            echo "BUILD SUCCESS"
            tail -n 10 build_stdout.log
          fi

      - name: Build release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanyabuy-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
        if: always()

      - name: Upload gradle log
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build_stdout.log
        if: always()
